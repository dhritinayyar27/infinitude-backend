spring.application.name=infinitude-backend
server.port=${SERVER_PORT:8080}

# MongoDB (Phase 2 onward). Provide via environment variable; never hardcode credentials.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/infinitude}

# CORS - frontend dev origin. Comma-separated list if multiple origins are ever needed.
infinitude.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# File storage (Phase 6-8: markdown/pdf generation)
infinitude.storage.markdown-dir=${MARKDOWN_STORAGE_DIR:storage/markdown}
infinitude.storage.pdf-dir=${PDF_STORAGE_DIR:storage/pdf}

# Gemini REST integration (Phase 3 onward). Key must come from environment only - never hardcode or commit.
# gemini.api.key=${GEMINI_API_KEY}
# gemini.api.model=${GEMINI_MODEL:gemini-2.0-flash}

# ---------------------------------------------------------------------------
# Authentication - Email + OTP (§17 PROJECT_ARCHITECTURE.md)
# ---------------------------------------------------------------------------
# NOTE: JWT_SECRET / JWT_EXPIRATION_SECONDS / OTP_EXPIRATION_SECONDS / OTP_MAX_ATTEMPTS /
# OTP_RESEND_COOLDOWN_SECONDS / MAIL_FROM are deliberately NOT re-declared as properties here.
# Spring Boot already exposes OS environment variables as a property source, so `@Value("${JWT_SECRET:...}")`
# etc. (see security.TokenService, security.OtpService, email.EmailServiceImpl) resolve directly
# against the environment, falling back to the safe inline default coded there if unset. Redeclaring
# `SOME_NAME=${SOME_NAME:default}` here would self-reference and fail to start (circular placeholder).
#
# - JWT_SECRET: REQUIRED in any real deployment, no default is committed here. TokenService ships
#   an insecure, loudly-commented, LOCAL-DEV-ONLY fallback default directly in code so the app
#   still boots on a fresh dev machine - see security/TokenService.java. Generate a real production
#   secret with e.g. `openssl rand -base64 48` and set it via the JWT_SECRET environment variable.
# - JWT_EXPIRATION_SECONDS: default 1800 (30 min) - short-lived access token per §17.6.
# - OTP_EXPIRATION_SECONDS: default 300 (5 min, §17.4).
# - OTP_MAX_ATTEMPTS: default 5 (§17.4).
# - OTP_RESEND_COOLDOWN_SECONDS: default 30 (§17.4).
# - MAIL_FROM: default no-reply@infinitude.local (used only when SMTP is actually configured).

# Additional in-memory rate limiting on top of the OTP resend cooldown (see security.RateLimiter).
infinitude.auth.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:5}
infinitude.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:900}

# Email delivery (OTP). Leave MAIL_HOST unset in local dev - EmailServiceImpl falls back to
# logging the OTP (see infinitude.email.dev-mode below) instead of failing startup.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password = ${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dev-only OTP log fallback switch. MUST be false (and real SMTP configured above) in any real
# deployment - see EmailServiceImpl javadoc. Defaults to true only to keep local dev frictionless.
infinitude.email.dev-mode=${EMAIL_DEV_MODE:true}

